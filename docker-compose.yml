services:

  # ============================================================
  # FRONTEND - NEXT.JS
  # ============================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        INTERNAL_API_URL: ${INTERNAL_API_URL}

    restart: unless-stopped

    expose:
      - "3000"

    environment:
      NODE_ENV: production

      # Browser -> FastAPI
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

      # Next.js container -> FastAPI container
      INTERNAL_API_URL: ${INTERNAL_API_URL}

    depends_on:
      backend:
        condition: service_started


  # ============================================================
  # BACKEND - FASTAPI
  # ============================================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    expose:
      - "8000"

    environment:

      # --------------------------------------------------------
      # MYSQL DATABASE
      # --------------------------------------------------------

      MYSQL_DATABASE: hrrealtyinternational
      MYSQL_USER: hruser
      MYSQL_PASSWORD: nikhil

      # --------------------------------------------------------
      # CORS
      # --------------------------------------------------------

      CORS_ORIGINS: ${CORS_ORIGINS}

      # --------------------------------------------------------
      # UPLOADS
      # --------------------------------------------------------

      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}

      # --------------------------------------------------------
      # JWT
      # --------------------------------------------------------

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

      # --------------------------------------------------------
      # PYTHON
      # --------------------------------------------------------

      PYTHONUNBUFFERED: "1"

    volumes:
      - backend_uploads:/app/uploads

    depends_on:
      mysql:
        condition: service_healthy


  # ============================================================
  # MYSQL DATABASE
  # ============================================================

  mysql:
    image: mysql:8.0

    restart: unless-stopped

    environment:

      MYSQL_ROOT_PASSWORD: nikhil

      MYSQL_DATABASE: hrrealtyinternational

      MYSQL_USER: hruser

      MYSQL_PASSWORD: nikhil

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" || exit 1"
        ]

      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


# ==============================================================
# DOCKER VOLUMES
# ==============================================================

volumes:

  mysql_data:
    name: hrrealty_mysql_data

  backend_uploads:
    name: hrrealty_backend_uploads