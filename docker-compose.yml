  mysql:
    image: mysql:8.0
    restart: unless-stopped

    command:
      - mysqld
      - --skip-grant-tables
      - --skip-networking=0

    environment:
      MYSQL_ROOT_PASSWORD: nikhil
      MYSQL_DATABASE: hrrealtyinternational
      MYSQL_USER: hruser
      MYSQL_PASSWORD: nikhil

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s